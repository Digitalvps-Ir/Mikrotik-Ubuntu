name: Validate CHR installer

on:
  push:
    paths:
      - script.sh
      - .github/workflows/validate.yml
  pull_request:
    paths:
      - script.sh
      - .github/workflows/validate.yml

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n script.sh
      - name: Check shell script
        run: shellcheck -S warning script.sh
      - name: Check embedded initramfs scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          source = Path('script.sh').read_text()
          for marker in ('HOOK', 'BOOT'):
              match = re.search(r"<<'" + marker + r"'\n(.*?)\n" + marker + r"\n", source, re.S)
              if not match:
                  raise SystemExit(f'Missing {marker} script')
              path = Path('/tmp/chr-' + marker.lower() + '.sh')
              path.write_text(match.group(1) + '\n')
              subprocess.run(['dash', '-n', str(path)], check=True)
              subprocess.run(['shellcheck', '-S', 'warning', '-s', 'sh', str(path)], check=True)
          PY
      - name: Check safe help path
        run: bash script.sh --help

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['7.24.4', '7.23.7', '6.49.22']
    steps:
      - name: Validate the official CHR RAW archive and partition table
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          archive="chr-${VERSION}.img.zip"
          image="chr-${VERSION}.img"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 900 \
            "https://download.mikrotik.com/routeros/${VERSION}/${archive}" -o "$archive"
          unzip -tq "$archive"
          test "$(unzip -Z -1 "$archive")" = "$image"
          unzip -p "$archive" "$image" > "$image"
          sfdisk -d "$image"

