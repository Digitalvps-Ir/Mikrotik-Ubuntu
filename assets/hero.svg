<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Digitalvps.ir MikroTik CHR installer</title>
  <desc id="description">A dark network-themed banner showing an Ubuntu virtual machine flowing through a safe installer to RouterOS CHR.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0B1021"/>
      <stop offset="0.58" stop-color="#14223B"/>
      <stop offset="1" stop-color="#102D36"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#42E8CD"/>
      <stop offset="1" stop-color="#74A9FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#AFCEFF" stroke-opacity=".065"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="105" fill="#46DCCE" opacity=".13" filter="url(#glow)"/>
  <circle cx="940" cy="290" r="85" fill="#7896FF" opacity=".15" filter="url(#glow)"/>

  <rect x="55" y="46" width="180" height="31" rx="15" fill="#223C50" stroke="#3B6C76"/>
  <circle cx="75" cy="61" r="5" fill="#44E4BE"/>
  <text x="89" y="67" fill="#B8F4E8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Digitalvps.ir</text>

  <text x="55" y="153" fill="#F5FBFF" font-family="Segoe UI, Arial, sans-serif" font-size="53" font-weight="800" letter-spacing="-1">MikroTik CHR</text>
  <text x="55" y="203" fill="#BFD3E8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Install from Ubuntu. Rescue optional.</text>
  <rect x="55" y="235" width="428" height="2" rx="1" fill="url(#accent)"/>
  <text x="55" y="277" fill="#9CB7CD" font-family="Segoe UI, Arial, sans-serif" font-size="19">Official RAW image  /  one-time boot  /  verified write</text>
  <text x="55" y="323" fill="#64D9CD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">OPEN SOURCE INSTALLER</text>

  <g transform="translate(722 56)">
    <rect x="0" y="12" width="420" height="250" rx="25" fill="#14283B" stroke="#416478" stroke-width="2"/>
    <rect x="19" y="31" width="382" height="45" rx="12" fill="#21394D"/>
    <circle cx="40" cy="53" r="5" fill="#58E3BE"/>
    <circle cx="57" cy="53" r="5" fill="#F7CA75"/>
    <circle cx="74" cy="53" r="5" fill="#EE7F9B"/>
    <text x="110" y="59" fill="#BFD9E7" font-family="Consolas, monospace" font-size="17">chr-install</text>
    <path d="M73 167H334" fill="none" stroke="#3D7682" stroke-width="6" stroke-linecap="round"/>
    <path d="M73 167H334" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="76" cy="167" r="25" fill="#263C55" stroke="#7BB5FF" stroke-width="3"/>
    <path d="M67 165h18m-18 7h18m-9-17v27" stroke="#B9D6FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="204" cy="167" r="28" fill="#1E4B50" stroke="#55E4CF" stroke-width="3"/>
    <path d="m194 168 7 7 14-16" fill="none" stroke="#9DF7E2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="331" cy="167" r="27" fill="#29405E" stroke="#91B6FF" stroke-width="3"/>
    <path d="M318 177v-17l13-8 13 8v17l-13 8z" fill="none" stroke="#C5DCFF" stroke-width="2"/>
    <path d="M318 160l13 8 13-8m-13 8v17" fill="none" stroke="#C5DCFF" stroke-width="2"/>
    <text x="46" y="226" fill="#AEC3DC" font-family="Segoe UI, Arial, sans-serif" font-size="15">Ubuntu</text>
    <text x="177" y="226" fill="#A2F1DD" font-family="Segoe UI, Arial, sans-serif" font-size="15">Verify</text>
    <text x="300" y="226" fill="#AEC3DC" font-family="Segoe UI, Arial, sans-serif" font-size="15">RouterOS</text>
  </g>
</svg>
